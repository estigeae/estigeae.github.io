<style>
  :root {
    --font-mono: "Space Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --dialog-w: 494px;
    --line: #5e5e5e;
    --line-hi: #8f8f8f;
    --sig: #474747;
    --sig-on: #f5f5f5;
  }
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color-scheme: dark;
    overflow: hidden;
  }
  .main-content {
    display: grid; place-content: center;
    width: 100dvw; height: 100dvh;
    transition: opacity 1.4s ease;
  }
  .main-content.saindo { opacity: 0; pointer-events: none; }
  #bg {
    position: fixed; top: 0; left: 0;
    width: 100dvw; height: 100dvh;
    opacity: .4;
    pointer-events: none;   
  }
  .row {
    display: grid;
    grid-template-columns: 1fr minmax(0, var(--dialog-w)) 1fr;
    align-items: center;
    width: 100dvw;
  }
  .row hr {
    width: 100%; margin: 0;
    border: none; border-top: 1px solid #fff;
    opacity: .4;
  }
  .input-container {
    position: relative;
    display: flex; justify-content: center; align-items: center;
    max-width: var(--dialog-w); height: 100px;
  }
  .input-container-bg { position: absolute; inset: 0; pointer-events: none; }
  .input-container-bg svg { display: block; width: 100%; height: 100%; }
  .input-2 {
    --content-w: clamp(300px, calc(100dvw - 32px), 640px);
    position: relative;
  }
  .text-input {
    display: block;
    width: calc(var(--content-w) * .625); max-width: 100%;
    padding: 4px 8px;
    border: none; outline: none; background: transparent;
    color: #fff;
    font-family: var(--font-mono); font-weight: 400;
    font-size: calc(var(--content-w) * .05);
    letter-spacing: calc(var(--content-w) * .01);
    text-align: center; text-transform: uppercase;
  }
  .caret-container {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer;
    opacity: 1; transition: opacity .4s ease-in-out;
  }
  .caret-container.inactive { opacity: 0; pointer-events: none; }
  .caret { width: 23px; height: 23px; margin-top: 1px; transition: scale .4s ease-in-out; }
  .caret-container:hover .caret { scale: 1.1; }
  .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .aberrando { filter: url(#chroma); will-change: filter; }
  #stage { display: none; }
  #stage.ativo { display: block; }
  #stage, #stage * { box-sizing: border-box; }
  #stage, #stage .layer { position: fixed; inset: 0; }
  #stage .layer svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ln { fill: none; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ln.hi { stroke: var(--line-hi); }
  .ln.faint { opacity: .6; }
  .ln.outer { transition: stroke 1.5s ease; }
  .pg {
    fill: none; stroke: #fff; stroke-width: 7; vector-effect: non-scaling-stroke;
    opacity: 0; transition: opacity 1.5s ease;
  }
  #stage.lit .ln.outer { stroke: #dcdcdc; transition: stroke .45s ease-out; }
  #stage.lit .pg       { opacity: .45;    transition: opacity .45s ease-out; }
  .sig .rb {
    fill: none; stroke: var(--sig); stroke-width: 1.25;
    stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
    transition: stroke .28s ease-out;
  }
  .sig .rg {
    fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round;
    vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .32s ease-out;
  }
  .sig.on .rb { stroke: var(--sig-on); transition-duration: .05s; }
  .sig.on .rg { opacity: .5; transition-duration: .06s; }
  .slot-cel {
    fill: none; stroke: var(--sig-on); stroke-width: 1;
    vector-effect: non-scaling-stroke;
    opacity: 0; transition: opacity .25s ease-out;
  }
  .slot-ch {
    fill: var(--sig-on); font-family: var(--font-mono);
    font-size: 17px; text-anchor: middle;
  }
  .slot-hit { fill: transparent; stroke: none; pointer-events: none; }
  #stage.inscricao #sceneWrap .slot-hit { pointer-events: all; cursor: pointer; }
  #stage.inscricao #sceneWrap .slot:hover .slot-cel { opacity: .45; }
  #stage.digitando .slot.ativa .slot-cel {
    opacity: .9; animation: piscaCasa 1.1s steps(2, start) infinite;
  }
  @keyframes piscaCasa { 50% { opacity: .2; } }
  #stage { transition: opacity 1.6s ease; }
  #stage.saindo, #bg.saindo { opacity: 0; pointer-events: none; }
  #bg { transition: opacity 1.6s ease; }
  #premio { display: none; position: fixed; inset: 0; }
  #premio.ativo { display: block; }
  #premio-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hex-ln {
    fill: none; stroke: var(--line); stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  .prisma { cursor: pointer; }
  .prisma:focus { outline: none; }
  .pr-base {
    fill: none; stroke: var(--line-hi); stroke-width: 1;
    vector-effect: non-scaling-stroke; transition: stroke .3s ease;
  }
  .pr-glow {
    fill: none; stroke: #fff; stroke-width: 5;
    vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .3s ease;
  }
  .pr-hit { fill: transparent; stroke: none; }
  .ct-ch {
    fill: none; stroke-width: 1; vector-effect: non-scaling-stroke;
    mix-blend-mode: screen; opacity: 0; pointer-events: none;
  }
  .ct-r { stroke: #c43030; }
  .ct-g { stroke: #30c44e; }
  .ct-b { stroke: #4466e0; }
  #premio.vivo .prisma .pr-glow { animation: respiraPrisma 3.6s ease-in-out infinite; }
  @keyframes respiraPrisma { 0%, 100% { opacity: .05; } 50% { opacity: .2; } }
  .prisma:hover .pr-glow, .prisma:focus-visible .pr-glow { animation: none; opacity: .5; }
  .prisma:hover .pr-base, .prisma:focus-visible .pr-base { stroke: var(--sig-on); }
  .prisma.lido .pr-base { stroke: var(--sig); }   
  @media (prefers-reduced-motion: reduce) {
    #premio.vivo .prisma .pr-glow { animation: none; opacity: .14; }
  }
  #leitura {
    position: fixed; inset: 0; z-index: 2;
    display: grid; place-content: center; padding: 24px;
    background: rgba(0, 0, 0, .62);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  #leitura.aberto { opacity: 1; pointer-events: auto; }
  .leitura-moldura {
    background: rgba(255, 255, 255, .42); padding: 1px;
    width: min(840px, calc(100dvw - 48px));
    clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
  }
  .leitura-corpo {
    background: #000; padding: 48px 54px 34px;
    max-height: calc(100dvh - 72px); overflow-y: auto;
    clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
  }
  #leitura-texto {
    margin: 0; color: #e6e6e6; white-space: pre-wrap;
    font-family: var(--font-mono); font-size: 16px; line-height: 2.05;
  }
  @media (max-width: 560px) {
    .leitura-corpo { padding: 32px 26px 24px; }
    #leitura-texto { font-size: 14px; line-height: 1.95; }
  }
  .leitura-fechar {
    display: block; width: 13px; height: 13px; margin: 26px auto 0; opacity: .45;
  }
  .leitura-fechar path { fill: #fff; }
  #centro-input {
    position: fixed; left: 50%; top: 50%;
    width: 1px; height: 1px; padding: 0; margin: 0; border: none;
    opacity: 0; background: transparent; color: transparent; caret-color: transparent;
    font-size: 16px;
  }
  #fx, #hint, #scan { display: none; pointer-events: none; }
  #fx.on, #hint.on, #scan.on { display: block; }
  #flash { pointer-events: none; background: #fff; opacity: 0; }
  .fxl { position: absolute; inset: 0; }
  .ch { mix-blend-mode: screen; }
  .red   { --line: #9c2424; --line-hi: #c43030; --sig: #6e1a1a; }
  .green { --line: #249c3a; --line-hi: #30c44e; --sig: #1a6e29; }
  .blue  { --line: #2e469c; --line-hi: #4466e0; --sig: #20306e; }
  .slice { display: none; background: #000; --line: #777; --line-hi: #a8a8a8; --sig: #555; }
  .slice.sr { --line: #c43030; --line-hi: #e84a4a; --sig: #8e2222; }
  .slice.sg { --line: #30c44e; --line-hi: #4ae868; --sig: #228e38; }
  .slice.sb { --line: #4466e0; --line-hi: #6a88f0; --sig: #2c3f9e; }
  .echo { mix-blend-mode: screen; opacity: 0; will-change: transform, opacity; }
  #scan { background: repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 3px); }
  #hint .hg line, #hint .hg circle, #hint .hg path {
    fill: none; stroke: #e4e4e4; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
</style>

const PHASES = ['inicio', 'contagemA', 'glitch', 'contagemB', 'final'];
async function flash(ids, ms) { setOn(ids, true); await wait(ms); setOn(ids, false); }
async function counts(side, list) {
  for (let k = 0; k < list.length; k++) {
    await flash(STEM, T.stemOn);
    await wait(T.stemGap);
    for (let n = 0; n < list[k]; n++) { await flash(side, T.flashOn); await wait(T.flashOff); }
    await wait(T.letterGap);
  }
}
async function glitch() {
  fx.start();
  await wait(T.hintAt);
  fx.showHint(true);
  await wait(T.hintMs);
  fx.showHint(false);
  await wait(Math.max(0, T.glitch - T.hintAt - T.hintMs));
  fx.stop();
}
async function finale() {
  for (let i = 0; i < T.finalFlashes; i++) {
    for (const id of FINAL_ORDER) { await flash([id], T.finalOn); await wait(T.finalOff); }
    await wait(T.finalGap);
  }
  setOn(ALL, true); stageEl.classList.add('lit');
  await wait(T.prismHold);
  setOn(ALL, false); stageEl.classList.remove('lit');
  await wait(T.prismFade);
}
async function cycle(from) {
  for (let i = Math.max(0, PHASES.indexOf(from)); i < PHASES.length; i++) {
    const p = PHASES[i];
    if (p === 'inicio')       await wait(T.startRest);
    else if (p === 'contagemA') { await counts(LEFT,  SEGREDO.contagemA); await wait(T.preGlitch); }
    else if (p === 'glitch')  { await glitch(); await wait(T.postGlitch); }
    else if (p === 'contagemB') { await counts(RIGHT, SEGREDO.contagemB); await wait(T.preFinal); }
    else if (p === 'final')   { await finale(); await wait(T.endRest); }
  }
}
async function loop(from) {
  try {
    for (let start = from; ; start = 'inicio') await cycle(start);
  } catch (e) {
    if (e !== ABORT) console.error(e);
  }
}
const entrada = document.getElementById('centro-input');
const sfx2    = document.getElementById('sfx2');
let slotEls = [];     
let letras  = [];
const ABERRACAO_FINAL = { peak: 70, duration: 5200, jitter: .6 };
const EXPLOSAO = { densidade: .5, opacidade: .9 };
let fase3 = false;
let casaAtiva = -1;
function pintarCasas() {
  slotEls.forEach((g, i) => {
    g.querySelector('.slot-ch').textContent = letras[i];
    g.classList.toggle('ativa', i === casaAtiva);
  });
}
function focarInscricao() {
  if (fase3 || entrada.disabled) return;   
  entrada.focus({ preventScroll: true });
  stageEl.classList.toggle('digitando', document.activeElement === entrada);
}
entrada.addEventListener('input', () => {
  const v = entrada.value.toUpperCase().replace(/[^A-Z]/g, '');
  entrada.value = '';
  if (casaAtiva < 0 || !v) return;    
  letras[casaAtiva] = v.slice(-1);
  pintarCasas();
});
const SETAS = { ArrowLeft: 'left', ArrowUp: 'top', ArrowRight: 'right', ArrowDown: 'bottom' };
entrada.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); conferirCentro(); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    e.preventDefault();               
    if (casaAtiva >= 0) { letras[casaAtiva] = ''; pintarCasas(); }
    return;
  }
  const arm = SETAS[e.key];
  if (arm) { e.preventDefault(); casaAtiva = ARMS.indexOf(arm); pintarCasas(); }
});
sceneWrap.addEventListener('pointerdown', e => {
  if (fase3) return;
  const alvo = e.target.closest('[data-slot]');
  if (!alvo) return;
  casaAtiva = +alvo.dataset.slot;
  pintarCasas();
});
entrada.addEventListener('focus', () => stageEl.classList.add('digitando'));
entrada.addEventListener('blur',  () => stageEl.classList.remove('digitando'));
document.addEventListener('pointerdown', e => {
  if (fase3 || entrada.disabled) return;
  if (e.pointerType === 'mouse' && e.target !== entrada) e.preventDefault();
  focarInscricao();
});
document.addEventListener('click', focarInscricao);
let conferindoCentro = false;
async function conferirCentro() {
  if (fase3 || conferindoCentro) return;
  if (letras.some(l => !l)) { place(); return; }   
  conferindoCentro = true;
  try {
    TEXTOS = await abrirCofre(COFRE.b, senha1 + '\u001f' + letras.join(''));
    fase3 = true;
    acertouCentro();
  } catch (err) {
    place();                      
  } finally {
    conferindoCentro = false;
  }
}
function pararEnigma() {
  run++;                          
  const pendentes = waiters; waiters = [];
  pendentes.forEach(w => w.res());
  setOn(ALL, false);
  stageEl.classList.remove('lit');
  fx.stop();
}
function acertouCentro() {
  entrada.readOnly = true;
  entrada.blur();
  pararEnigma();
  pararFaixa(faixaAmb);           
  sfx2.currentTime = 0;
  sfx2.play().catch(() => {});
  const vida = ABERRACAO_FINAL.duration / 1000;
  explosaoDeGlifos(EXPLOSAO.densidade, vida);
  canvas.animate(
    [{ opacity: EXPLOSAO.opacidade }, { opacity: .4 }],
    { duration: ABERRACAO_FINAL.duration, easing: 'ease-out' },
  );
  aberracao([stageEl, canvas], ABERRACAO_FINAL);
  setTimeout(entrarNaRecompensa, ABERRACAO_FINAL.duration + PREMIO.esperaApos);
}
const PREMIO = {
  esperaApos: 600,      
  fadeOut: 1600,        
  antesDoDesenho: 900,  
  traco: 2800,          
  prisma: 900,          
  prismaStagger: 190,
};
const HEX_R = 240;
const HEX_PTS = Array.from({ length: 6 }, (_, i) => {
  const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
  return [+(Math.cos(a) * HEX_R).toFixed(2), +(Math.sin(a) * HEX_R).toFixed(2)];
});
const HEX_D = 'M' + HEX_PTS.map(p => p.join(' ')).join('L') + 'Z';
const PRISMA_D = 'M0 -10L10 0L0 10L-10 0Z';
const CENTRO_RAIO = 58;
const DISTORCAO = [1, .88, 1.08, .94, 1.1, .9, 1.02, .86, 1.06, .95];
function poligonoDistorcido(desvio = 0) {
  const n = DISTORCAO.length;
  return 'M' + DISTORCAO.map((m, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const r = CENTRO_RAIO * (m + (desvio ? (Math.random() * 2 - 1) * desvio : 0));
    return `${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r).toFixed(1)}`;
  }).join('L') + 'Z';
}
const CENTRO_D = poligonoDistorcido();
const GLITCH_CENTRO = {
  intervalo: [2200, 5600],   
  duracao:   [160, 420],     
  passo: 55,                 
  desvio: .22,               
  separacao: 8,              
};
const premioEl   = document.getElementById('premio');
const premioSvg  = document.getElementById('premio-svg');
const leituraEl  = document.getElementById('leitura');
const leituraTxt = document.getElementById('leitura-texto');
premioSvg.innerHTML =
  `<defs><filter id="pblur" filterUnits="userSpaceOnUse" x="-700" y="-600" width="1400" height="1200">
     <feGaussianBlur stdDeviation="3.2"/></filter></defs>` +
  `<path class="hex-ln" d="${HEX_D}"/>` +
  HEX_PTS.map(([x, y], i) =>
    `<g class="prisma" data-ponto="${i}" tabindex="0" role="button" transform="translate(${x} ${y})">
       <path class="pr-glow" filter="url(#pblur)" d="${PRISMA_D}"/>
       <path class="pr-base" d="${PRISMA_D}"/>
       <circle class="pr-hit" r="24"/>
     </g>`).join('') +
  `<g class="prisma centro" data-ponto="6" tabindex="0" role="button">
     <path class="pr-glow" filter="url(#pblur)" d="${CENTRO_D}"/>
     <path class="ct-ch ct-r" d="${CENTRO_D}"/>
     <path class="ct-ch ct-g" d="${CENTRO_D}"/>
     <path class="ct-ch ct-b" d="${CENTRO_D}"/>
     <path class="pr-base" d="${CENTRO_D}"/>
     <path class="pr-hit" d="${CENTRO_D}"/>
   </g>`;
const ctGlow = premioSvg.querySelector('.centro .pr-glow');
const ctBase = premioSvg.querySelector('.centro .pr-base');
const ctCanais = [
  [premioSvg.querySelector('.ct-r'), -1],
  [premioSvg.querySelector('.ct-g'),  .4],
  [premioSvg.querySelector('.ct-b'),  1],
];
let ctTimer = null;
function surtoCentro() {
  const d = poligonoDistorcido(GLITCH_CENTRO.desvio);
  ctBase.setAttribute('d', d);
  ctGlow.setAttribute('d', d);
  ctCanais.forEach(([el, lado]) => {
    el.setAttribute('d', poligonoDistorcido(GLITCH_CENTRO.desvio));
    el.setAttribute('transform',
      `translate(${(lado * GLITCH_CENTRO.separacao * (.4 + Math.random())).toFixed(1)} ` +
      `${((Math.random() * 2 - 1) * 3).toFixed(1)})`);
    el.style.opacity = (.5 + Math.random() * .5).toFixed(2);
  });
}
function acalmarCentro() {
  ctBase.setAttribute('d', CENTRO_D);
  ctGlow.setAttribute('d', CENTRO_D);
  ctCanais.forEach(([el]) => {
    el.setAttribute('d', CENTRO_D);
    el.removeAttribute('transform');
    el.style.opacity = '0';
  });
}
function agendarSurto() {
  const [a, b] = GLITCH_CENTRO.intervalo;
  ctTimer = setTimeout(rodarSurto, a + Math.random() * (b - a));
}
function rodarSurto() {
  const [a, b] = GLITCH_CENTRO.duracao;
  const fim = performance.now() + a + Math.random() * (b - a);
  (function passo() {
    if (performance.now() >= fim) { acalmarCentro(); agendarSurto(); return; }
    surtoCentro();
    ctTimer = setTimeout(passo, GLITCH_CENTRO.passo);
  })();
}
function entrarNaRecompensa() {
  stageEl.classList.add('saindo');
  canvas.classList.add('saindo');
  setTimeout(() => {
    stageEl.style.display = 'none';
    canvas.style.display = 'none';
    glyphs.length = 0;
    desenharRecompensa();
  }, PREMIO.fadeOut + PREMIO.antesDoDesenho);
}
async function desenharRecompensa() {
  premioEl.classList.add('ativo');
  tocarEmLoop(faixaPremio);         
  const caixa = premioSvg.getBoundingClientRect();
  const escala = Math.min(caixa.width / 1000, caixa.height / 800) || 1;
  const hex = premioSvg.querySelector('.hex-ln');
  const L = hex.getTotalLength() * escala;
  hex.style.strokeDasharray = L;
  hex.style.strokeDashoffset = L;
  const animacoes = [hex.animate(
    [{ strokeDashoffset: L }, { strokeDashoffset: 0 }],
    { duration: PREMIO.traco, easing: 'ease-in-out', fill: 'forwards' },
  )];
  const prismas = [...premioSvg.querySelectorAll('.prisma')];
  prismas.forEach(g => { g.style.opacity = '0'; });
  prismas.forEach((g, i) => {
    animacoes.push(g.animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: PREMIO.prisma, delay: PREMIO.traco + i * PREMIO.prismaStagger,
        easing: 'ease-out', fill: 'forwards' },
    ));
  });
  const aoRedimensionar = () => animacoes.forEach(a => { try { a.finish(); } catch (e) {} });
  addEventListener('resize', aoRedimensionar);
  await Promise.all(animacoes.map(a => a.finished.catch(() => {})));
  removeEventListener('resize', aoRedimensionar);
  hex.style.strokeDasharray = '';
  hex.style.strokeDashoffset = '';
  prismas.forEach(g => { g.style.opacity = ''; });
  animacoes.forEach(a => a.cancel());
  premioEl.classList.add('vivo');   
  if (!reduceMotion) agendarSurto();
}
function abrirLeitura(g) {
  const i = +g.dataset.ponto;
  leituraTxt.textContent = i === HEX_PTS.length ? TEXTOS.centro : TEXTOS.vertices[i];
  leituraEl.classList.add('aberto');
  g.classList.add('lido');
}
const fecharLeitura = () => leituraEl.classList.remove('aberto');
premioSvg.addEventListener('click', e => {
  const g = e.target.closest('.prisma');
  if (g) abrirLeitura(g);
});
premioSvg.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const g = e.target.closest && e.target.closest('.prisma');
  if (!g) return;
  e.preventDefault();
  abrirLeitura(g);
});
leituraEl.addEventListener('click', fecharLeitura);
addEventListener('keydown', e => { if (e.key === 'Escape') fecharLeitura(); });
function iniciarEnigma() {
  entrada.disabled = false;
  stageEl.classList.add('inscricao');   
  sfx2.load();                   
  baixarFaixa(faixaPremio);      
  pintarCasas();
  focarInscricao();              
  clock.last = performance.now();
  requestAnimationFrame(tick);
  loop('inicio');
}
</script>
